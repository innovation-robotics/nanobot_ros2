/**:
  ros__parameters:
    marker_size: 0.08
    aruco_dictionary_id: "DICT_4X4_250"   # <-- MUST be in quotes!
    image_is_rectified: true
    camera_frame: "camera_optical_frame"
    reference_frame: "map"
    use_camera_info: true

